<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0f1328"><meta name="description" content="Afterlife · 与数字人物对话 · DeepSeek AI"><title>Afterlife · 数字分身</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css" defer></head>
<body><div class="app-shell">
<aside class="sidebar"><div class="brand"><div class="brand-mark">✦</div><div><strong>Afterlife</strong><small>数字分身 · DeepSeek</small></div></div>
<div class="section-head"><span>我的数字人物</span><button id="new-btn" title="创建数字人物" class="icon-btn">＋</button></div><div id="characters" class="character-list"></div>
<div class="sidebar-bottom"><div class="secure-note">🔒 人物资料与聊天记录保存在此浏览器。只有你发送给 AI 的内容会提交服务器。</div><button id="export-btn" class="subtle-btn">导出备份</button><button id="import-btn" class="subtle-btn">导入备份</button><input id="import-file" type="file" accept="application/json,.json" hidden></div></aside>
<main class="main"><header class="topbar"><div><div class="eyebrow">DIGITAL COMPANION</div><h1 id="chat-title">我的数字分身</h1><div id="chat-subtitle" class="subtitle">选择一个人物，开始聊天</div></div><div class="top-actions"><select id="model" aria-label="DeepSeek 模型"><option value="deepseek-flash">DeepSeek Flash</option><option value="deepseek-v4-pro">DeepSeek V4 Pro</option></select><button id="edit-btn" class="ghost-btn">编辑人物</button><button id="access-btn" class="ghost-btn">访问口令</button></div></header>
<section class="conversation" id="conversation" aria-live="polite"><div class="empty"><div class="empty-glyph">✧</div><h2>让珍贵的记忆，拥有对话的可能</h2><p>为重要的人建立数字人物，记录经历、性格和表达习惯。AI 模拟并不代表本人意识或真实言论。</p><button id="create-hero" class="primary-btn">创建第一个数字人物 <span>→</span></button></div></section>
<form id="composer" class="composer"><textarea id="message" rows="2" maxlength="6000" placeholder="输入你想说的话…（Enter 发送，Shift+Enter 换行）" aria-label="聊天消息"></textarea><button id="send" class="send-btn" type="submit">发送 ↗</button></form><footer class="footer">由 DeepSeek 模型生成 · 内容可能有误 · 请勿输入未经同意的隐私资料</footer></main>
</div>
<dialog id="character-dialog" class="modal"><form id="character-form" method="dialog"><h2 id="dialog-title">创建数字人物</h2><label>人物名称<input id="person-name" required maxlength="50" placeholder="例如：外婆、儿时好友" autocomplete="off"></label><label>人物背景与说话方式<textarea id="person-prompt" rows="8" maxlength="7000" placeholder="写下这个人的生平、性格、常用词、与你的关系，以及希望 AI 如何交流。请注明这是 AI 模拟。"></textarea></label><div class="modal-actions"><button id="delete-person" type="button" class="danger-btn" hidden>删除人物</button><button id="cancel-person" type="button" class="ghost-btn">取消</button><button id="save-person" type="submit" class="primary-btn">保存</button></div></form></dialog>
<dialog id="access-dialog" class="modal"><form id="access-form" method="dialog"><h2>输入访问口令</h2><p>使用服务器管理员提供的访问口令。DeepSeek API 密钥只保存在服务器中，切勿填在此处。</p><label>访问口令<input id="access-value" type="password" required autocomplete="off" placeholder="服务器访问口令"></label><div class="modal-actions"><button type="button" id="close-access" class="ghost-btn">取消</button><button type="submit" class="primary-btn">保存口令</button></div></form></dialog>
<div id="toast" class="toast" role="status"></div><script type="module" src="/app.js"></script></body></html>
